<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <title>Unit Converter</title>
  </head>
  <body>
    <main>
      <div class="container">
        <div class="upper-section">
          <h1>Metric/Imperial Unit Conversion</h1>
          <!-- <h2 id="result-txt">20</h2> -->
          <input type="text" id="unit-input" />
          <button id="convert-btn">Convert</button>
        </div>
        <div class="lower-section">
          <div id="length-card" class="result-card">
            <h3>Length (Meter/Feet)</h3>
            <p>20 meters = 65.616 feet | 20 feet = 6.096 meters</p>
          </div>
          <div id="volume-card" class="result-card">
            <h3>Volume (Liters/Galon)</h3>
            <p>20 liters = 5.284 gallons | 20 gallons = 75.708 liters</p>
          </div>
          <div id="mass-card" class="result-card">
            <h3>Mass (Kilograms/Pounds)</h3>
            <p>20 kilos = 44.092 pounds | 20 pounds = 9.072 kilos</p>
          </div>
        </div>
      </div>
    </main>
    <script src="index.js"></script>
  </body>
</html>
